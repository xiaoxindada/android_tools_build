when:
  - event: [manual, push, pull_request]
    branch: main
    path:
      on_empty: false
      include:
        - "**/*.yaml"
        - "**/*.toml"
        - "**/*.rs"
        - "src/**"

steps:
  - name: build-x86_64-linux-gnu
    image: amd64/rockylinux:9-minimal
    environment:
      RUST_BACKTRACE: 1
      RUST_LOG: trace
      CARGO_INCREMENTAL: 0
    commands:
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --verbose --default-toolchain stable --default-host x86_64-unknown-linux-gnu --component rustfmt -y
      - . "$HOME/.cargo/env"
      - cargo fmt --all --check
      - microdnf install --nodocs --assumeyes clang libselinux-devel
      - cargo build --verbose --workspace --jobs=1 --target=x86_64-unknown-linux-gnu
      - cargo test --verbose --workspace --jobs=1 --target=x86_64-unknown-linux-gnu --no-run
      - cargo test --verbose --workspace --jobs=1 --target=x86_64-unknown-linux-gnu -- --test-threads=1 --nocapture
